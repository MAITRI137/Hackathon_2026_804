<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">PeoplePay360 — payroll confidence before money moves</title>
  <desc id="description">A branded PeoplePay360 banner showing source records flowing through a readiness gate into an explainable payslip.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfd"/>
      <stop offset="1" stop-color="#e8f2f8"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d94c6"/>
      <stop offset="1" stop-color="#1b5e87"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10222c" flood-opacity=".10"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2274a5" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#canvas)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1120" cy="58" r="122" fill="#6da2c2" opacity=".10"/>
  <circle cx="77" cy="390" r="150" fill="#2274a5" opacity=".06"/>

  <g transform="translate(62 56)">
    <rect width="64" height="64" rx="15" fill="url(#brand)"/>
    <path d="M32 12.5a19.5 19.5 0 1 1-13.8 5.7" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="18.2" cy="18.2" r="3.1" fill="#fff"/>
    <circle cx="32" cy="26.5" r="6.4" fill="#fff"/>
    <path d="M20 46.5c0-6.5 5.4-11 12-11s12 4.5 12 11v.8a1 1 0 0 1-1 1H21a1 1 0 0 1-1-1z" fill="#fff"/>
    <path d="M26.5 41.5h11M26.5 45h11" stroke="#1b5e87" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <text x="146" y="84" fill="#16232c" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">PeoplePay360</text>
  <text x="146" y="112" fill="#6b8290" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="1.8">HR &amp; PAYROLL OPERATING SYSTEM</text>

  <text x="62" y="188" fill="#16232c" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="750">Know payroll is right</text>
  <text x="62" y="235" fill="#2274a5" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="750">before money moves.</text>
  <text x="62" y="277" fill="#435663" font-family="Segoe UI, Arial, sans-serif" font-size="17">Readiness gates, explainable calculations, role-safe workflows</text>
  <text x="62" y="303" fill="#435663" font-family="Segoe UI, Arial, sans-serif" font-size="17">and live operational visibility in one calm control surface.</text>

  <g transform="translate(62 337)">
    <rect width="148" height="34" rx="17" fill="#fff" stroke="#b9d7e8"/>
    <circle cx="20" cy="17" r="5" fill="#0f7b3d"/>
    <text x="34" y="22" fill="#435663" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">5,000+ records</text>
    <rect x="160" width="138" height="34" rx="17" fill="#fff" stroke="#b9d7e8"/>
    <circle cx="180" cy="17" r="5" fill="#2274a5"/>
    <text x="194" y="22" fill="#435663" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">297 employees</text>
    <rect x="310" width="158" height="34" rx="17" fill="#fff" stroke="#b9d7e8"/>
    <circle cx="330" cy="17" r="5" fill="#d97706"/>
    <text x="344" y="22" fill="#435663" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Explain every rupee</text>
  </g>

  <g transform="translate(676 55)" filter="url(#shadow)">
    <rect width="462" height="310" rx="22" fill="#fff" stroke="#e1e9ee"/>
    <text x="28" y="39" fill="#16232c" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">SEPTEMBER PAYROLL</text>
    <rect x="326" y="20" width="108" height="30" rx="15" fill="#ecfdf3"/>
    <circle cx="345" cy="35" r="5" fill="#0f7b3d"/>
    <text x="358" y="40" fill="#0f7b3d" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SYSTEM LIVE</text>

    <g transform="translate(28 76)">
      <rect width="112" height="72" rx="12" fill="#f7fafc" stroke="#e1e9ee"/>
      <text x="16" y="26" fill="#6b8290" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">SOURCE DATA</text>
      <circle cx="19" cy="49" r="4" fill="#2274a5"/>
      <circle cx="34" cy="49" r="4" fill="#6da2c2"/>
      <circle cx="49" cy="49" r="4" fill="#b7d3e4"/>
      <text x="62" y="54" fill="#435663" font-family="Segoe UI, Arial, sans-serif" font-size="12">297 people</text>
    </g>

    <path d="M148 112H178" stroke="#6da2c2" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="163" cy="112" r="4" fill="#2274a5"/>

    <g transform="translate(178 76)">
      <rect width="112" height="72" rx="12" fill="#f2f8fc" stroke="#b9d7e8"/>
      <text x="15" y="26" fill="#2274a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">READINESS GATE</text>
      <text x="16" y="55" fill="#16232c" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="750">100%</text>
      <path d="M72 50l7 7 15-18" fill="none" stroke="#0f7b3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <path d="M298 112H328" stroke="#6da2c2" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="313" cy="112" r="4" fill="#2274a5"/>

    <g transform="translate(328 76)">
      <rect width="106" height="72" rx="12" fill="#2274a5"/>
      <text x="16" y="26" fill="#dcedf6" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">PAYSLIP</text>
      <text x="16" y="53" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="750">₹ 74,800</text>
    </g>

    <line x1="28" y1="176" x2="434" y2="176" stroke="#e1e9ee"/>
    <text x="28" y="207" fill="#6b8290" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">LIVE REQUEST PATH</text>
    <path d="M56 248H386" stroke="#b9d7e8" stroke-width="2" stroke-dasharray="5 7"/>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="600">
      <circle cx="56" cy="248" r="16" fill="#2274a5"/><text x="56" y="275" fill="#435663">Browser</text>
      <circle cx="166" cy="248" r="16" fill="#6da2c2"/><text x="166" y="275" fill="#435663">API</text>
      <circle cx="276" cy="248" r="16" fill="#6da2c2"/><text x="276" y="275" fill="#435663">Prisma</text>
      <circle cx="386" cy="248" r="16" fill="#1b5e87"/><text x="386" y="275" fill="#435663">PostgreSQL</text>
    </g>
    <g fill="#fff">
      <circle cx="56" cy="248" r="4"/><circle cx="166" cy="248" r="4"/><circle cx="276" cy="248" r="4"/><circle cx="386" cy="248" r="4"/>
    </g>
  </g>

  <text x="1138" y="400" text-anchor="end" fill="#6b8290" font-family="Segoe UI, Arial, sans-serif" font-size="12">Odoo Hackathon 2026 · Team 804</text>
</svg>
