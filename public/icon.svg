<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PeoplePay360">
  <defs>
    <linearGradient id="pp-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d94c6"/>
      <stop offset="1" stop-color="#1b5e87"/>
    </linearGradient>
    <linearGradient id="pp-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded product tile, in the family of an application launcher icon -->
  <rect width="64" height="64" rx="15" fill="url(#pp-tile)"/>
  <rect width="64" height="64" rx="15" fill="url(#pp-sheen)"/>

  <!-- The 360 ring: payroll as a closed, repeating cycle -->
  <path d="M32 12.5a19.5 19.5 0 1 1-13.8 5.7"
        fill="none" stroke="#ffffff" stroke-opacity=".55"
        stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="18.2" cy="18.2" r="3.1" fill="#ffffff"/>

  <!-- A person, and the pay they are owed -->
  <circle cx="32" cy="26.5" r="6.4" fill="#ffffff"/>
  <path d="M20 46.5c0-6.5 5.4-11 12-11s12 4.5 12 11v.8a1 1 0 0 1-1 1H21a1 1 0 0 1-1-1z"
        fill="#ffffff"/>
  <path d="M26.5 41.5h11M26.5 45h11"
        stroke="#1b5e87" stroke-width="2.4" stroke-linecap="round"/>
</svg>
